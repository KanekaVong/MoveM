name: movem
description: "movem"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  
  # State Management & Routing
  get: ^4.6.6
  
  # HTTP Client
  dio: ^5.4.3
  http: ^1.2.0
  
  # Security/Cryptography
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.1
  
  # Utilities
  intl: ^0.20.2
  timezone: ^0.11.0
  cached_network_image: ^3.3.1
  logger: ^2.7.0

  # Assets
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.2
  permission_handler: 11.4.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  fl_chart: ^1.2.0
  build_runner: ^2.4.13
  path_provider: ^2.1.6
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  image_picker: ^1.1.2
  camera: ^0.12.0+2
  google_mlkit_pose_detection: ^0.16.1
  google_mlkit_commons: ^0.13.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
