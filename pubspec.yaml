name: movem
description: "movem"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & Routing
  get: ^4.6.6
  
  # HTTP Client
  dio: ^5.4.3
  http: ^1.2.0
  
  # Security/Cryptography
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.1
  
  # Utilities
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
